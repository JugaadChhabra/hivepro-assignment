# tests/golden/golden_set.yaml
#
# Hand-built evaluation set for the TawasolPay risk ranking.
# Nothing in this file is generated by the scorer. It is judgement, recorded
# before the scorer's output was seen, and it is what the scorer is measured
# against.
#
# Referencing: findings are identified by vuln_id, which is unique per row in
# vulnerabilities.csv. asset_id and cve are duplicated for human readability
# and are asserted by the loader — if they disagree with the CSV, the loader
# raises rather than silently trusting vuln_id.

meta:
  version: 1
  created: "2026-09-02"
  annotator: "<your name>"
  method: >
    Blind pairwise comparison. Findings were presented with evidence fields
    only (asset, environment, exposure, CVSS, exploit status, intel match,
    business service, control gaps) with no computed score and no ordering
    hint. Each judgement was challenged with the opposing case before being
    recorded; pairs whose reasoning did not survive the challenge were moved
    to `excluded`.
  caveat: >
    Single annotator. This is calibrated judgement, not consensus ground
    truth. Contested pairs are marked and excluded from the primary metric.
  dataset_fingerprint: "<sha256 of the five CSVs concatenated, filled by make eval>"

# ---------------------------------------------------------------------------
# PAIRWISE CONSTRAINTS  —  primary metric
#
# Assertion: score(higher) > score(lower). Strictly greater, never equal.
# Target ~12-15 entries. Only include pairs you can defend under argument.
#
# blind: true   — drawn from the ~104 findings not yet observed in scorer
#                 output. These form the HEADLINE metric.
# blind: false  — involves a finding already seen ranked. Prior exposure
#                 compromises independence; reported separately.
#
# Pairs with confidence: low AND contested: true are excluded from the
# headline metric and reported as a third figure. See P08 for why.
# ---------------------------------------------------------------------------

pairwise:

  # ---- P01: pre-given by the assignment brief itself --------------------
  # The take-home states: "A vulnerability sitting on an internal-only dev
  # server with a CVSS of 10 should rank lower than a CVSS 8 on an
  # internet-exposed payment gateway with an active ransomware campaign
  # pointing at it." This is the employer's own stated expectation, so it is
  # a constraint rather than an opinion. Included first and never removed.
  - id: P01
    source: assignment_brief          # assignment_brief | mdr_report | annotator
    higher:
      vuln_id: V-2010
      cve: CVE-2024-6387
      asset_id: A-1003
      asset_name: payment-api-prod-01
      note: "OpenSSH Unauthenticated RCE (regreSSHion) · CVSS 8.1 · internet-exposed · Production · Payment Processing · exploit available"
    lower:
      vuln_id: V-2095
      cve: CVE-2024-23897
      asset_id: A-1046
      asset_name: dev-build-server-01
      note: "Jenkins Arbitrary File Read via CLI · CVSS 9.8 · internal only · Development · Software Delivery · exploit available"
    reason: >
      Higher CVSS on an internal development host does not outweigh a
      reachable, production, payment-scoped asset. Exposure and business
      context dominate raw severity.
    factors: [internet_exposure, environment, business_criticality, compliance_scope]
    confidence: high
    contested: false

  # ---- P02 ---------------------------------------------------------------
  # First annotator judgement. Notable: this pair is what surfaced the
  # blast-radius gap in the scorer. The initial call was X (customer data /
  # GDPR outweighs an internal engineering tool), reversed to Y once the MDR
  # report's description of RedMantis pivoting from project management
  # platforms into CI/CD to harvest credentials and plant source-code
  # backdoors was weighed. The scorer at the time modelled neither campaign
  # objective nor service dependency fan-out, which is why this constraint
  # drove the phase-6 blast-radius group.
  - id: P02
    source: annotator
    blind: true
    higher:
      vuln_id: V-2036
      cve: CVE-SYN-2026-0004
      asset_id: A-1012
      asset_name: jira-prod
      note: "Project Management Platform RCE · CVSS 9.7 · internet-exposed · Production · Software Delivery · exploit available, no auth · 16 days · RedMantis ransomware, weaponised, high confidence"
    lower:
      vuln_id: V-2033
      cve: CVE-2025-24813
      asset_id: A-1011
      asset_name: crm-app-prod
      note: "Apache Tomcat Partial PUT RCE · CVSS 9.8 · internet-exposed · Production · CRM Platform, customer-facing, GDPR · exploit available, no auth · 21 days · no intel match"
    reason: >
      Both are internet-facing with working unauthenticated exploits and
      comparable CVSS, so exposure and exploitability tie. Y wins on live
      adversary activity: a ransomware crew is actively hunting this exact
      platform, which is a running clock rather than a hypothetical. The
      apparent counterargument — that X touches customer data under GDPR and
      Y only an internal engineering tool — understates Y, because the MDR
      report describes RedMantis using project management platforms as an
      entry point into CI/CD to harvest credentials and backdoor source code.
      Y is a supply-chain foothold, not a contained outage.
    factors: [active_campaign, ransomware, campaign_objective, lateral_movement]
    confidence: medium
    contested: true
    counterargument: >
      X is customer-facing GDPR data and a breach carries regulatory
      notification and fines; absence of an intel match on X reflects
      incomplete feed coverage rather than safety, and X's attack chain is
      already complete without a named actor running it.

  # ---- P03 ---------------------------------------------------------------
  # Round 1, pair 02. Initial call was X on active-exploitation grounds;
  # reversed to Y once "internal only" was understood correctly — X requires
  # an attacker to already hold a foothold inside the network, which is a
  # step they have not taken. Exposure does not tie here, so it governs.
  - id: P03
    source: annotator
    blind: true
    higher:
      vuln_id: V-2052
      cve: CVE-2024-6387
      asset_id: A-1016
      asset_name: customer-support-portal
      note: "OpenSSH Unauthenticated RCE · CVSS 8.1 · internet-exposed · Production · Customer Support Portal, customer-facing, GDPR · exploit available, no auth · 39 days · no intel match"
    lower:
      vuln_id: V-2053
      cve: CVE-2024-28986
      asset_id: A-1017
      asset_name: helpdesk-prod
      note: "SolarWinds Web Help Desk Deserialization RCE · CVSS 9.8 · internal only · Production · Employee Services, not customer-facing, GDPR · exploit available, no auth · 60 days · PhantomGrid ransomware, active exploitation"
    reason: >
      Y is reachable from the open internet with a working unauthenticated
      exploit and hits customer data under GDPR. X carries a live ransomware
      campaign but is internal-only, so exploiting it presupposes a foothold
      the attacker does not yet have. Higher CVSS on X does not compensate for
      requiring a prior breach.
    factors: [internet_exposure, customer_facing, compliance_scope]
    confidence: high
    contested: false

  # ---- P04 ---------------------------------------------------------------
  # Round 1, pair 03. Surfaced the recovery-of-last-resort gap: Backup and
  # Recovery has ZERO transitive dependents, so the phase-6 blast-radius
  # signal scores it DOWN, despite it being the fallback for every other
  # incident. See P09 for the same pattern recurring.
  - id: P04
    source: annotator
    blind: true
    higher:
      vuln_id: V-2071
      cve: CLOUD-SYN-001
      asset_id: A-1024
      asset_name: backup-storage-prod
      note: "Storage Bucket Public Policy Misconfiguration · CVSS 9.1 · internal only · Production · Backup and Recovery, ISO 27001 · exploit available, no auth · 21 days · no EDR · NightHarbor ransomware, active exploitation"
    lower:
      vuln_id: V-2074
      cve: K8S-SYN-001
      asset_id: A-1025
      asset_name: k8s-cluster-prod-01
      note: "Kubernetes Dashboard Exposed Without Auth · CVSS 9.5 · internal only · Production · Payment Processing, customer-facing, PCI DSS · NO exploit available · 45 days · EDR installed · unknown actor, proof of concept"
    reason: >
      X wins on four independent dimensions: a working exploit exists where
      Y's is theoretical, an active ransomware crew versus an unattributed
      PoC, no EDR at all, and the MDR report's own intelligence-gap note
      instructing that backup systems be assumed under active profiling.
      Decisively, backups are the recovery path for every other ransomware
      incident, so losing them converts recoverable events into catastrophic
      ones.
    factors: [exploit_available, ransomware, active_exploitation, no_edr, recovery_of_last_resort]
    confidence: high
    contested: false

  # ---- P05 ---------------------------------------------------------------
  # Round 1, pair 04. Deliberately overrides exposure and exploitability —
  # the top two rubric factors — on unpatchability and consequence grounds.
  - id: P05
    source: annotator
    blind: true
    higher:
      vuln_id: V-2089
      cve: CVE-SYN-2024-0001
      asset_id: A-1034
      asset_name: legacy-payments-db
      note: "Windows Server 2012 R2 End of Support · CVSS 10.0 · internal only · Production · Financial Reporting, SOC 2 + IFRS · NO exploit available, auth required · 365 days · no EDR · GhostByte, commodity exploit, no ransomware"
    lower:
      vuln_id: V-2058
      cve: CVE-2024-4577
      asset_id: A-1019
      asset_name: corporate-site-prod
      note: "WordPress Plugin RCE · CVSS 9.8 · internet-exposed · Production · Corporate Website, no compliance scope, 0 dependents · exploit available, no auth · 35 days · EDR installed · AmberFox PoC + GrayLotus commodity, neither ransomware"
    reason: >
      X cannot be remediated at all — the OS is past end-of-support, so the
      fix is asset replacement rather than a patch, and it has sat unowned for
      a year with no monitoring over SOC 2 and IFRS financial data. Y is
      immediately exploitable but its blast radius is a marketing site with no
      compliance scope and nothing depending on it; defacement is embarrassing
      rather than material.
    factors: [unpatchable, days_open, no_edr, compliance_scope, low_consequence_on_lower]
    confidence: high
    contested: true
    counterargument: >
      Y is exploitable today with a public unauthenticated exploit while X
      requires both a foothold and credentials; ranking a hypothetical above
      a live attack path inverts the rubric's top two factors.

  # ---- P06 ---------------------------------------------------------------
  - id: P06
    source: annotator
    blind: true
    higher:
      vuln_id: V-2081
      cve: CTRL-SYN-009
      asset_id: A-1030
      asset_name: secrets-vault-prod
      note: "HashiCorp Vault Audit Log Disabled · CVSS 8.0 · internal only · Production · DevOps Platform, SOC 2 · no exploit · 60 days · EDR installed · Critical criticality"
    lower:
      vuln_id: V-2029
      cve: CTRL-SYN-003
      asset_id: A-1009
      asset_name: finance-db-prod-01
      note: "Excessive DB User Privileges · CVSS 7.6 · internal only · Production · Financial Reporting, SOC 2 + IFRS · no exploit · 90 days · EDR installed · Critical criticality"
    reason: >
      Both are control deficiencies rather than exploitable flaws. X wins on
      what the asset holds: a secrets vault stores credentials to other
      systems, so a compromise there is not one database but access to the
      estate, and disabling its audit log removes the only record of what was
      taken. The asymmetry is in the asset, not in the control type.
    factors: [asset_sensitivity, credential_blast_radius, detective_control_loss]
    confidence: medium
    contested: true
    counterargument: >
      Excessive privilege is a preventive control and audit logging is merely
      detective — Y actually reduces what an attacker can do, is 30 days
      older, and sits in SOC 2 + IFRS scope where the audit finding bites.

  # ---- P07 ---------------------------------------------------------------
  - id: P07
    source: annotator
    blind: true
    higher:
      vuln_id: V-2043
      cve: CVE-2024-27198
      asset_id: A-1014
      asset_name: teamcity-prod
      note: "JetBrains TeamCity Authentication Bypass · CVSS 9.8 · internet-exposed · Production · DevOps Platform, SOC 2 · exploit available, no auth · 155 days · NO EDR · SilentForge, weaponised, credential/IP theft, not ransomware"
    lower:
      vuln_id: V-2040
      cve: CVE-2023-22527
      asset_id: A-1013
      asset_name: confluence-prod
      note: "Confluence RCE via OGNL Injection · CVSS 10.0 · internet-exposed · Production · Software Delivery, SOC 2 · exploit available, no auth · 200 days · EDR installed · RedMantis ransomware, weaponised"
    reason: >
      Exposure and exploitability tie. X lacks EDR entirely, and the campaign
      targeting it is specifically designed to evade detection — the MDR
      report describes SilentForge maintaining access over weeks while
      mimicking normal build activity. The missing control is precisely the
      one that campaign is built to defeat, which makes the combination worse
      than either factor alone.
    factors: [no_edr, campaign_objective, credential_theft, stealth_campaign]
    confidence: medium
    contested: true
    counterargument: >
      Y carries ransomware at CVSS 10.0 and 45 days longer open; a loud,
      immediately catastrophic encryption event arguably outranks a slow
      credential harvest, and Y's EDR may not stop a weaponised RCE anyway.

  # ---- P08 ---------------------------------------------------------------
  # PROVENANCE CAVEAT: both findings are on the SAME asset (A-1059), so this
  # pair discriminates between problem TYPES, not between assets. The
  # annotator's initial answer was framed in remediation-effort terms rather
  # than risk terms; on re-framing, the annotator adopted the reviewer's
  # risk reasoning rather than reaching it independently. Recorded at low
  # confidence for that reason and excluded from the headline metric.
  # Judging X properly also requires cross-finding context on the host
  # (365-day EOL OS, 280-day IIS flaws, no EDR) that the scorer does not model.
  - id: P08
    source: annotator
    blind: true
    higher:
      vuln_id: V-2111
      cve: CTRL-SYN-012
      asset_id: A-1059
      asset_name: legacy-reporting-server
      note: "Orphaned Asset — No Assigned Owner · CVSS 8.0 · internal only · Production · Financial Reporting, SOC 2 + IFRS · no exploit · 62 days · no EDR"
    lower:
      vuln_id: V-2108
      cve: CVE-SYN-2024-0001
      asset_id: A-1059
      asset_name: legacy-reporting-server
      note: "Windows Server 2012 R2 End of Support · CVSS 10.0 · internal only · Production · Financial Reporting, SOC 2 + IFRS · NO exploit available · 365 days · no EDR · GhostByte, commodity exploit"
    reason: >
      Ownership absence is a risk generator rather than a single instance of
      risk: an unowned host holding regulated financial data accrues problems
      indefinitely and nobody is positioned to notice an intrusion. The
      365-day-old EOL OS and the 280-day-old IIS flaws on the same box are
      symptoms of X, not independent findings.
    factors: [no_owner, unmonitored, compliance_scope, root_cause]
    confidence: low
    contested: true
    counterargument: >
      Y is a concrete CVSS 10.0 unpatchable condition that exists today,
      whereas X is a process failure with no direct exploit path; ranking
      governance above a technical flaw is a management judgement rather than
      a risk one.

  # ---- P09 ---------------------------------------------------------------
  # Second occurrence of the recovery-of-last-resort pattern (see P04).
  # Two independent pairs landing the same way is what elevated this from
  # anecdote to a documented scoring gap.
  - id: P09
    source: annotator
    blind: true
    higher:
      vuln_id: V-2114
      cve: CTRL-SYN-001
      asset_id: A-1060
      asset_name: dr-failover-site
      note: "No EDR on Disaster Recovery Site · CVSS 7.5 · internal only · Production · Backup and Recovery, ISO 27001, 0 dependents · no exploit · 38 days · Critical criticality"
    lower:
      vuln_id: V-2086
      cve: CVE-SYN-2024-0012
      asset_id: A-1032
      asset_name: marketing-cms-prod
      note: "PHP 7.4 End of Life · CVSS 7.5 · internet-exposed · Production · Corporate Website, NO compliance scope, 0 dependents · no exploit · 280 days · EDR installed · Medium criticality"
    reason: >
      Identical CVSS. X is the disaster-recovery site with no monitoring on
      it — the environment you fail over to when production is destroyed —
      and is rated Critical. Y is internet-facing and nine months stale, but
      it is the marketing site: no compliance scope, no dependents, and a
      compromise is reputational rather than operational.
    factors: [recovery_of_last_resort, no_edr, criticality, low_consequence_on_lower]
    confidence: high
    contested: false

  # P10 RESOLVED IN PHASE 6b — moved to `excluded` below. It asserted the
  # opposite of §4's staleness rule; the conflict was decided in §4's favour on
  # measured grounds (staleness additive buys zero headline pairwise and cannot
  # satisfy P10 without inventing signals). See the P10 entry under `excluded`.

  # ---- P11 ---------------------------------------------------------------
  # Introduces rto_hours as a factor. NOTE: rto_hours is currently UNUSED by
  # the scorer — the fourth unused column found during annotation, after
  # depends_on, business_impact, and this one. Phase 6 candidate.
  - id: P11
    source: annotator
    blind: true
    higher:
      vuln_id: V-2013
      cve: CVE-2024-6387
      asset_id: A-1004
      asset_name: payment-api-prod-02
      note: "OpenSSH Unauthenticated RCE · CVSS 8.1 · internet-exposed · Production · Payment Processing, PCI DSS, customer-facing, RTO 1hr, 1 dependent · exploit available, no auth · 41 days · Critical criticality · EDR installed · no intel"
    lower:
      vuln_id: V-2047
      cve: CVE-2024-4577
      asset_id: A-1015
      asset_name: hr-portal-prod
      note: "PHP CGI Argument Injection · CVSS 9.8 · internet-exposed · Production · Employee Services, GDPR, not customer-facing, RTO 12hr, 0 dependents · exploit available, no auth · 30 days · High criticality · EDR installed · AmberFox PoC + GrayLotus commodity, neither ransomware"
    reason: >
      Exposure and exploitability tie. X wins on business tolerance, stated
      explicitly in the data: Payment Processing carries a 1-hour recovery
      target against Employee Services' 12 hours, meaning the business has
      declared it can absorb twelve hours of HR downtime and one hour of
      payments downtime. Reinforced by Critical over High criticality, PCI DSS
      customer payment data over internal HR data, and one dependent service
      over none. Y's higher CVSS does not overcome an explicit statement of
      business tolerance.
    factors: [rto_hours, criticality, compliance_scope, customer_facing, transitive_dependents]
    confidence: high
    contested: false

  # ---- P12 ---------------------------------------------------------------
  - id: P12
    source: annotator
    blind: true
    higher:
      vuln_id: V-2093
      cve: CTRL-SYN-011
      asset_id: A-1038
      asset_name: vpn-staging
      note: "Staging VPN Shares Production Credentials · CVSS 9.0 · internet-exposed · Production · Remote Access, ISO 27001, RTO 2hr · no exploit · 30 days · Medium criticality · no EDR"
    lower:
      vuln_id: V-2070
      cve: CTRL-SYN-006
      asset_id: A-1023
      asset_name: network-firewall-01
      note: "Firewall Rule Allows Overly Broad Inbound Access · CVSS 7.9 · internet-exposed · Production · Remote Access, ISO 27001, RTO 2hr · no exploit · 180 days · Critical criticality · no EDR"
    reason: >
      Both are configuration failures rather than software flaws. X is worse
      because it removes the need to attack production at all: an attacker
      breaches the lower-security staging system and walks into production
      holding valid credentials. It also converts every internal-only finding
      in the estate into reachable, the same door-into-the-network dynamic as
      the perimeter VPN findings.
    factors: [credential_reuse, lateral_movement, perimeter_bypass]
    confidence: medium
    contested: true
    counterargument: >
      Y is Critical criticality against X's Medium and has been open 180 days
      versus 30. A firewall permitting overly broad inbound traffic for six
      months is a live, unconditional exposure, whereas X's risk is
      conditional on staging being compromised first.



  # Template — copy per pair:
  #
  # - id: P02
  #   source: annotator
  #   higher:
  #     vuln_id:
  #     cve:
  #     asset_id:
  #     asset_name:
  #     note:
  #   lower:
  #     vuln_id:
  #     cve:
  #     asset_id:
  #     asset_name:
  #     note:
  #   reason: >
  #   factors: []            # which signals drove the call
  #   confidence: high       # high | medium
  #   contested: false       # true if the counterargument was genuinely strong
  #   counterargument: >     # required when contested: true
  #
  # Aim for coverage across factors rather than 12 variations of
  # "exposed beats internal". Deliberately include at least one pair each for:
  #   - intel match present vs absent, exposure held constant
  #   - ransomware association vs non-ransomware campaign
  #   - EDR absent vs present, everything else equal
  #   - PCI/GDPR scope vs no compliance scope
  #   - a CTRL-SYN control deficiency vs a software CVE
  #   - stale asset record vs fresh, to prove staleness does not inflate

# ---------------------------------------------------------------------------
# GOLDEN TOP FIVE  —  secondary metric (precision@5)
#
# Post-dedupe. If a finding appears on multiple assets (the Fortinet VPN pair,
# the CitrixBleed load balancer pair), it occupies ONE slot and lists both
# assets, matching what select.py produces.
#
# Set membership is what is scored. Exact ordering within the five is recorded
# for interest but is NOT asserted — ordering confidence at that resolution
# would be overclaiming.
# ---------------------------------------------------------------------------

top_five:
  # blind: false — the annotator had already observed the scorer's top 10
  # before this selection was made (see meta.caveat). precision_at_5 is
  # therefore a SECONDARY metric; the blind pairwise rate is the headline.
  # Selection was made from a 12-candidate shortlist presented as evidence
  # tables without scores, which limits but does not eliminate the exposure.
  blind: false

  entries:
    - rank: 1
      cve: CVE-2023-4966
      vulnerability_name: Citrix ADC Session Token Leak (CitrixBleed)
      affected_assets: [load-balancer-prod-01, load-balancer-prod-02]
      vuln_ids: [V-2064, V-2066]
      business_service: Customer Login / Payment Processing
      justification: >
        180 days exposed, actively exploited in the wild, and defeats MFA by
        inheriting a live session rather than stealing credentials. Sits in
        front of both customer login and payment processing, 1h RTO, no EDR on
        either appliance. The accurate board framing is not "we might be
        breached" but "we cannot prove we have not been" — 180 days of
        unmonitored exposure is an unknown dwell time. Remediation is patch,
        force global session invalidation, and open a retrospective hunt.

    - rank: 2
      cve: CVE-2024-21762
      also_covers: CVE-2024-55591
      vulnerability_name: Fortinet SSL-VPN Heap Buffer Overflow RCE
      affected_assets: [vpn-edge-01, vpn-edge-02, vpn-staging]
      vuln_ids: [V-2015, V-2016, V-2019, V-2020, V-2092]
      business_service: Remote Access
      grouping_note: >
        Two CVEs deliberately treated as one entry: pre-auth bypass
        (CVE-2024-55591) chaining into RCE (CVE-2024-21762) on the same
        appliances, described by the MDR report as a single CrimsonJackal
        exploit chain and closed by a single FortiOS update. If the scorer
        surfaces either CVE on any vpn host, this entry is satisfied.
        CORRECTION (phase 5): the shortlist originally listed two assets; the
        identical Fortinet finding also sits on vpn-staging (V-2092), and select.py
        dedupes on (cve, vulnerability_name) so it collapses ACROSS environments.
        Dedupe keeps the highest-scoring instance (vpn-edge, Production), so the
        brief reports vpn-edge severity while listing staging among the assets —
        the renderer notes "affects 3 assets across Production and Staging". Staging
        is not a lower-stakes environment here (see P12: staging shares production
        credentials).
      justification: >
        Both weaponised, CrimsonJackal is a ransomware actor confirmed
        operating in the region this week, and neither appliance has EDR.
        This is the textbook opening move for an estate-wide ransomware event,
        and compromising it converts every internal-only finding in the estate
        into a reachable one.

    - rank: 3
      cve: CVE-SYN-2026-0011
      vulnerability_name: Kong Gateway Admin API Exposed
      affected_assets: [partner-api-gateway-prod]
      vuln_ids: [V-2024]
      business_service: Partner API Gateway
      justification: >
        Highest probability of exploitation on the list precisely because
        there is no exploit to develop — it is a configuration error
        answerable to curl, and mass scanners find exposed Kong admin
        interfaces within days. Control means silent rerouting of partner and
        payment traffic rather than a visible outage, so the failure mode is
        undetected fraud rather than downtime. PCI DSS and ISO 27001 scope.
        Also the cheapest fix in the set: hours, not weeks.

    - rank: 4
      cve: CVE-SYN-2026-0001
      vulnerability_name: Remote Code Execution in Web Framework
      affected_assets: [auth-gateway-prod-01]
      vuln_ids: [V-2001]
      business_service: Customer Login
      justification: >
        CVSS 9.8, internet-exposed, 1h RTO, GDPR scope, weaponised, and
        ShadowMint targets the Middle East. Promoted after initially ranking
        sixth: ShadowMint not being a ransomware crew lowers URGENCY, not
        CONSEQUENCE, and a pre-auth RCE on the asset that issues customer
        identity does not belong outside the top five on that technicality.

    - rank: 5
      cve: CVE-SYN-2026-0010
      vulnerability_name: Payment API Insecure Direct Object Reference
      affected_assets: [payment-api-prod-01]
      vuln_ids: [V-2009]
      business_service: Payment Processing
      justification: >
        Retained after un-grouping from CitrixBleed on independent merits. An
        IDOR does not require a hijacked session, only ANY session: anyone who
        can register an account can begin enumerating other customers'
        objects. It therefore remains exploitable after rank 1 is closed.
        Direct path to cardholder data, actively exploited class, PCI DSS,
        1h RTO.

# Findings seriously considered for the top five and cut. Recording these is
# worth more than it looks: it shows the cut was a decision, and it gives the
# near-miss cases to check when a weight change reshuffles the ranking.
near_misses:
  - cve: CLOUD-SYN-001
    vulnerability_name: Storage Bucket Public Policy Misconfiguration
    affected_assets: [backup-storage-prod]
    vuln_ids: [V-2071]
    reason_excluded: >
      Closest call in the set. Cut on two grounds: it is the only candidate
      marked not internet-exposed, and its harm is conditional on a ransomware
      event actually landing rather than being harm in itself. 4h RTO is also
      the most forgiving of the six candidates. Everything ranked above it is
      a live, directly reachable path to customer or payment data.
    reversal_trigger: >
      DATA MODEL DEFECT — RESOLVED in phase 7. "Exposed: No" on a bucket
      carrying a public object policy is an incoherent pairing: public
      object-level policies are frequently readable via the cloud provider's
      own URL regardless of network position, and perimeter scanners mark them
      unexposed for want of a network path. Network-perimeter exposure is the
      wrong model for cloud object storage.
      Phase 7 added the exposure_model_mismatch rule (score exposure as
      reachable, internet_exposed left untouched). V-2071 duly entered the
      top-5. OUTCOME DIFFERED FROM THIS PREDICTION, on purpose kept visible:
      this note predicted V-2009 would be the casualty ("rank 5 takes this slot
      instead"). It was not. Phase 6b's rto_hours term — written AFTER this
      prediction — gave V-2009 (Payment Processing, 1h RTO) +5 and lifted it
      clear of the cut (V-2009 = 97.3). The finding actually displaced was
      Fortinet, CVE-2024-21762 (vpn-edge, 89.8), golden rank 2. That drop is
      NOT a scoring error to fix here: it is the supporting-question-3
      limitation (the scorer models per-service business impact, so the VPN-edge
      initial-access pivot is under-weighted). precision@5 = 0.800 is its
      measured cost. top_five is deliberately LEFT UNCHANGED — updating it to
      match the scorer would be tuning golden to output after seeing it. See
      tests/test_eval.py::test_precision_at_5_is_0_8_documented_pivot_gap.

  - cve: CVE-2023-22527
    vulnerability_name: Confluence RCE via OGNL Injection
    affected_assets: [confluence-prod]
    vuln_ids: [V-2040]
    reason_excluded: >
      The proof that a CVSS-ordered list is the wrong list. A perfect 10.0
      with a 24h RTO, EDR installed, and no customer or payment data. If a
      scoring model puts this in the top five, the model is ranking severity
      rather than risk.

  - cve: CVE-2024-27198
    vulnerability_name: JetBrains TeamCity Authentication Bypass
    affected_assets: [teamcity-prod]
    vuln_ids: [V-2043]
    reason_excluded: >
      155 days open, weaponised, no EDR — but 12h RTO, SOC 2 only, no
      customer or payment data. Consistent with P07, where the same finding
      was ranked above Confluence, and with P02's reasoning that supply-chain
      footholds carry real weight without displacing direct paths to
      regulated data.

  - cve: CVE-SYN-2026-0002
    vulnerability_name: API Authentication Bypass
    affected_assets: [idv-gateway-prod]
    vuln_ids: [V-2005]
    reason_excluded: >
      Dropped on imminence, not consequence. Highest transitive blast radius
      in the estate (Identity Verification carries 5 dependent services) and
      the only finding in UAE PDPL scope, but the exploit is proof-of-concept
      only, there is no ransomware association, and EDR is present. Watch
      this one: if its maturity ever moves to weaponised it belongs in the
      top three.

# Findings past 150 days open, recorded as a class rather than individually.
# The annotator's note: three findings past 150 days is a remediation-PROCESS
# failure rather than a vulnerability finding, and belongs on a separate slide
# with a different title. L (CTRL-SYN-006, 180 days) also feeds rank 2, since
# overly broad inbound firewall rules are part of why the edge is reachable.
process_failure_class:
  vuln_ids: [V-2040, V-2043, V-2070]
  days_open: [200, 155, 180]
  note: >
    Not a golden-set assertion. Recorded because a system that surfaces these
    as three independent findings has missed the pattern a human reader sees
    immediately.

# ---------------------------------------------------------------------------
# RETRIEVAL LABELS  —  recall@3 for the RAG path
#
# Independent of ranking. expected_controls is the control you would cite if
# you were writing the remediation by hand. acceptable_controls are defensible
# alternates that count as a hit — NIST families overlap and insisting on one
# right answer would measure pedantry rather than retrieval quality.
# ---------------------------------------------------------------------------

retrieval:
  # PROVENANCE: drafted by the reviewer, not the annotator. Lower risk than
  # the ranking labels — "which control covers unpatched software" has a
  # largely correct answer rather than requiring judgement. Two conditions:
  #
  #  1. VERIFY every control_id against the fetched catalog in phase 4.
  #     A wrong ID makes recall@3 unmeasurable rather than merely wrong.
  #     eval.py's loader contract already asserts this (rule 5).
  #  2. The reviewer authored FAMILY_HINTS, so labels that merely mirror it
  #     would be circular. Entries below marked `family_hint_gap: true` point
  #     at families the map does not currently cover — those are evidence the
  #     labels were derived independently, and each one is a required change
  #     to families.py in phase 4.
  #
  # A hit = expected_controls OR acceptable_controls appearing anywhere in
  # the top 3. Acceptable alternates exist because NIST families overlap;
  # insisting on one answer would measure pedantry rather than retrieval.

  - id: R01
    finding_type: unpatched_software
    example_vuln_id: V-2015
    query_context: "unpatched network appliance firmware, internet-facing, weaponised exploit available"
    expected_controls: [SI-2]
    acceptable_controls: [RA-5]
    reason: >
      Flaw Remediation is the direct control for an unapplied vendor patch.
      Vulnerability Monitoring is acceptable as it covers the detection half.
      (SI-2(2) dropped in phase 4: retrieval collapses enhancements to their base,
      so it is unreachable as a distinct answer — it collapses to SI-2, already expected.)

  - id: R02
    finding_type: end_of_life_software
    example_vuln_id: V-2108
    query_context: "operating system past vendor end-of-support, no security patches will be issued"
    expected_controls: [SA-22]
    acceptable_controls: [SI-2, CM-6]
    reason: >
      Unsupported System Components is the only control addressing the
      no-patch-will-ever-exist case; everything else assumes a fix exists.

  - id: R03
    finding_type: exposed_admin_interface
    example_vuln_id: V-2024
    query_context: "administrative API exposed to untrusted network without authentication"
    expected_controls: [AC-3]
    acceptable_controls: [SC-7, AC-6, CM-7]
    reason: >
      Access Enforcement is the direct control; Boundary Protection is
      acceptable as the network-layer remedy, Least Functionality as the
      configuration-layer one.

  - id: R04
    finding_type: missing_edr
    example_vuln_id: V-2114
    query_context: "no endpoint detection or malicious code protection agent installed on production host"
    expected_controls: [SI-3]
    acceptable_controls: [SI-4, IR-4]
    reason: >
      Malicious Code Protection is the specific control for endpoint
      anti-malware; System Monitoring covers the detection capability lost.

  - id: R05
    finding_type: excessive_privilege
    example_vuln_id: V-2029
    query_context: "database accounts hold permissions beyond what their function requires"
    expected_controls: [AC-6]
    acceptable_controls: [AC-2, AC-3]
    reason: >
      Least Privilege is exactly this finding. Account Management is
      acceptable as the lifecycle control that should have prevented it.

  - id: R06
    finding_type: audit_logging_disabled
    example_vuln_id: V-2081
    query_context: "audit logging disabled on secrets management system, no record of credential access"
    expected_controls: [AU-12]
    acceptable_controls: [AU-2, AU-6, AU-9]
    reason: >
      Audit Record Generation is the control requiring the capability be
      enabled. AU-2 covers what must be logged, AU-9 protecting the records.
    family_hint_gap: true
    note: "FAMILY_HINTS has no audit_logging_disabled entry — add ['AU']."

  - id: R07
    finding_type: missing_encryption_at_rest
    example_vuln_id: V-2031
    query_context: "database storing regulated financial data without encryption at rest"
    expected_controls: [SC-28]
    acceptable_controls: [SC-13, SC-12]
    reason: >
      Protection of Information at Rest is the direct control. SC-13 covers
      the cryptographic mechanism, SC-12 the key management it depends on.
    family_hint_gap: true
    note: "FAMILY_HINTS has no missing_encryption_at_rest entry — add ['SC']."

  - id: R08
    finding_type: orphaned_asset
    example_vuln_id: V-2111
    query_context: "production asset with no assigned owning team, absent from maintained inventory"
    expected_controls: [CM-8]
    acceptable_controls: [PM-5, CM-3]
    reason: >
      System Component Inventory requires assets be tracked with
      accountability. PM-5 is the programme-level equivalent.

  - id: R09
    finding_type: backup_deficiency
    example_vuln_id: V-2073
    query_context: "no immutability policy on backups, ransomware could encrypt recovery copies"
    expected_controls: [CP-9]
    acceptable_controls: [CP-10, CP-6]
    reason: >
      System Backup covers protection and integrity of backup copies.
      CP-10 covers the recovery capability that depends on them.

  - id: R10
    finding_type: dr_not_tested
    example_vuln_id: V-2113
    query_context: "disaster recovery site has not been tested in over six months"
    expected_controls: [CP-4]
    acceptable_controls: [CP-2, CP-10]
    reason: >
      Contingency Plan Testing is precisely an untested-recovery finding.

  - id: R11
    finding_type: authentication_bypass
    example_vuln_id: V-2005
    query_context: "API authentication can be bypassed, requests processed without valid identity"
    expected_controls: [IA-2]
    acceptable_controls: [AC-3, IA-8, IA-5]
    reason: >
      Identification and Authentication is the control the bypass defeats.
      AC-3 acceptable since enforcement fails downstream of identity.

  - id: R12
    finding_type: credential_reuse
    example_vuln_id: V-2093
    query_context: "lower-security staging environment shares credentials with production"
    expected_controls: [IA-5]
    acceptable_controls: [AC-2, SC-2]
    reason: >
      Authenticator Management governs credential scoping and separation.
      SC-2 acceptable as the separation-of-environments angle.
    family_hint_gap: true
    note: "New finding_type; FAMILY_HINTS should map credential_reuse to ['IA','AC']."

  - id: R13
    finding_type: secrets_exposed
    example_vuln_id: V-2045
    query_context: "build secrets and API credentials written in plaintext to CI/CD logs"
    expected_controls: [IA-5]
    acceptable_controls: [SC-12, AU-9, SC-28]
    reason: >
      Authenticator Management covers protection of credentials in storage
      and transit. SC-12 acceptable for key material specifically.
    family_hint_gap: true
    note: "New finding_type; map secrets_exposed to ['IA','SC','AU']."

  - id: R14
    finding_type: public_storage_policy
    example_vuln_id: V-2071
    query_context: "cloud storage bucket policy permits public read access to backup data"
    expected_controls: [AC-3]
    acceptable_controls: [AC-6, SC-28, AC-21]
    reason: >
      Access Enforcement is the control violated by a permissive object
      policy. Note this finding also triggers the exposure_model_mismatch
      flag — see the near_misses reversal_trigger.

  - id: R15
    finding_type: firewall_misconfiguration
    example_vuln_id: V-2070
    query_context: "firewall rule permits overly broad inbound access from untrusted networks"
    expected_controls: [SC-7]
    acceptable_controls: [AC-4, CM-6]
    reason: >
      Boundary Protection is the direct control. AC-4 acceptable for the
      information-flow framing, CM-6 for the configuration baseline.

  - id: R16
    finding_type: input_validation
    example_vuln_id: V-2032
    query_context: "SQL injection through unvalidated user input in search parameter"
    expected_controls: [SI-10]
    acceptable_controls: [SA-11, SI-15]
    reason: >
      Information Input Validation is the specific control. SA-11 acceptable
      as the developer-testing control that should have caught it.
    family_hint_gap: true
    note: "New finding_type; map input_validation to ['SI','SA']."

  - id: R17
    finding_type: insecure_direct_object_reference
    example_vuln_id: V-2009
    query_context: "API returns other users' records when object identifier is manipulated, any authenticated session sufficient"
    expected_controls: [AC-3]
    acceptable_controls: [AC-4, SI-10, AC-6]
    reason: >
      Access Enforcement — the flaw is that authorisation is not checked per
      object. Distinct from R11: identity is valid, entitlement is not.

  - id: R18
    finding_type: session_management
    example_vuln_id: V-2035
    query_context: "session timeout excessively long, sessions not terminated after inactivity"
    expected_controls: [AC-12]
    acceptable_controls: [AC-11, IA-11]
    reason: >
      Session Termination governs inactivity timeouts directly.
    family_hint_gap: true
    note: "New finding_type; map session_management to ['AC','IA']."

  - id: R19
    finding_type: missing_rate_limiting
    example_vuln_id: V-2011
    query_context: "payment endpoint has no rate limiting, vulnerable to abuse and resource exhaustion"
    expected_controls: [SC-5]
    acceptable_controls: [SI-10, AC-7]
    reason: >
      Denial-of-Service Protection covers resource-exhaustion controls.
    family_hint_gap: true
    note: "New finding_type; map missing_rate_limiting to ['SC','SI']."

  - id: R20
    finding_type: certificate_expiry
    example_vuln_id: V-2067
    query_context: "TLS certificate approaching expiry on customer-facing load balancer"
    expected_controls: [SC-17]
    acceptable_controls: [SC-12, SC-8]
    reason: >
      Public Key Infrastructure Certificates covers certificate lifecycle
      management specifically.
    family_hint_gap: true
    note: "New finding_type; map certificate_expiry to ['SC']."

  - id: R21
    finding_type: data_masking_absent
    example_vuln_id: V-2080
    query_context: "customer personal data not masked or de-identified in development queries"
    expected_controls: [SI-19]
    acceptable_controls: [AC-3, SC-28, AC-23]
    reason: >
      De-identification is the Rev 5 control for masking regulated data in
      non-production use. Verify SI-19 exists in the fetched catalog — this
      is the label I am least certain of.

  - id: R22
    finding_type: container_misconfiguration
    example_vuln_id: V-2014
    query_context: "container process running as root, no privilege separation"
    expected_controls: [AC-6]
    acceptable_controls: [CM-7, CM-6, SC-2]
    reason: >
      Least Privilege applies to process privilege as much as user
      privilege. CM-7 acceptable as the hardening framing.

# ---------------------------------------------------------------------------
# EXCLUDED  —  pairs proposed and dropped
#
# Kept in the file on purpose. These are the honest answer to "where is your
# ranking genuinely contestable", and two or three of them belong in the
# README. A golden set with no discarded pairs was not stress-tested.
# ---------------------------------------------------------------------------

excluded:
  - proposed:
      higher_vuln_id: V-2109      # legacy-reporting-server, 62d unseen, no owner
      lower_vuln_id: V-2090       # legacy-payments-db, 45d unseen, owned
    dropped_because: >
      Was P10. Deliberately encoded to CONTRADICT §4's staleness rule
      (last_seen_days > 30 sets a flag and adds ZERO points, so a
      possibly-decommissioned host does not climb the ranking). Phase 6b
      resolved the conflict in §4's favour and retired this pair, on three
      measured/analysed grounds:
        1. Making staleness additive produces ZERO headline pairwise change.
           The only stale asset in any non-contested pair is P09's HIGHER,
           already-passing side, so an additive term cannot break — only
           strengthen — the headline, and it flips nothing.
        2. A flat staleness term does not even satisfy P10: both findings are
           stale (62d and 45d), so both receive the same points and the margin
           is unchanged (+0.2 before and after). Satisfying P10 on its stated
           reasoning (62d-unowned outranks 45d-owned) would require graded-by-
           days staleness PLUS a no-owner compounding term — new signals added
           solely to move one contested pair, which the phase-6b brief forbids.
        3. §4's reasoning is sound and this pair's own counterargument concedes
           it: staleness may mean the host is decommissioned, and inflating a
           dead box's rank wastes remediation effort against live, exposed,
           exploitable findings. Staleness is an inventory-reconciliation signal
           (surfaced as a flag, still visible in the report) rather than an
           exploitability one, and belongs out of the numeric rank.
      Note that P10 only ever "passed" incidentally, on a 0.3 CVSS delta (IIS
      8.3 vs PostgreSQL 8.0), never on the visibility argument it was built on —
      so it did not validate its own thesis. §4 stands unchanged; the no-owner
      compounding intuition is recorded here as a candidate signal, not built.

  - proposed:
      higher_vuln_id: V-2111
      lower_vuln_id: V-2108
    dropped_because: >
      SUPERSEDED — retained as P08 at low confidence rather than dropped. See
      the provenance caveat on P08.

  - proposed:
      higher_vuln_id: V-2045
      lower_vuln_id: V-2044
    dropped_because: >
      Two problems. First, the annotator's reasoning was that the lower
      finding (TeamCity path traversal) becomes less likely once the higher
      one (CI/CD secrets in build logs) is fixed — but the dependency runs the
      opposite way. V-2045 requires authentication (auth_required: Yes) while
      V-2044 needs none and has been open 155 days versus 14. V-2044 is the
      entry path and V-2045 is the prize found after entry, so fixing V-2045
      first leaves the unauthenticated door open. Second, both findings sit on
      the same asset (teamcity-prod, A-1014), so the pair discriminates
      between problem types rather than between assets. Recorded rather than
      silently dropped: the inverted reasoning is itself a useful signal that
      exploit prerequisites need to be visible in the rendered output.

# ---------------------------------------------------------------------------
# LOADER CONTRACT  (implement in eval.py)
#
#   1. Every vuln_id resolves to exactly one row in vulnerabilities.csv.
#   2. Every cve / asset_id in this file matches that row. Mismatch -> raise.
#   3. No finding appears on both sides of the same pair.
#   4. No pair is duplicated or contradicted by another pair.
#   5. Every control_id in `retrieval` exists in the NIST catalog.
#   6. Placeholder strings ("<fill...>") anywhere -> raise. Half-filled golden
#      sets silently pass and are worse than none.
#
# METRICS PRINTED BY eval.py
#
#   pairwise_satisfaction   = satisfied / total, excluding contested: true
#   pairwise_contested      = satisfied / total, contested only (reported, not gated)
#   precision_at_5          = |predicted top5 ∩ golden top5| / 5
#   retrieval_recall_at_3   = hits / total, where a hit is expected ∪ acceptable
#                             appearing anywhere in the top 3
#
# CI GATE: pairwise_satisfaction must not decrease between commits.
# ---------------------------------------------------------------------------
