[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskagent"
version = "0.1.0"
description = "TawasolPay Cyber Risk Assistant"
requires-python = ">=3.11"
# Runtime dependencies are added phase-by-phase, each with a one-line justification.
# NOTE (§8 deploy): sentence-transformers/torch are DELIBERATELY NOT runtime deps.
# The embedding model runs at build time only (embed the catalog + precompute the
# query vectors); the deployed service does a vector lookup against those precomputed
# vectors, so it fits Render's 512MB free tier. See the `build` extra below.
dependencies = [
    "pydantic>=2.7",  # typed data contracts — the spine of the pipeline (§2)
    "chromadb>=0.5",  # persistent local vector store for NIST controls only (§5)
    "fastapi>=0.110",  # the read-only service (§6)
    "uvicorn>=0.29",  # ASGI server for `make run` (§6)
    "jinja2>=3.1",  # deterministic HTML/Markdown rendering, no model calls (§6)
    "groq>=0.11",  # LLM provider for the explanation sentence only (§6)
    "pyyaml>=6.0",  # parse the golden set / eval config (§7)
]

[project.optional-dependencies]
# Build-time only: embeds the NIST catalog and precomputes the per-finding query
# vectors during `docker build`. Pulls torch — never installed in the runtime image.
build = [
    "sentence-transformers>=3.0",  # local CPU embeddings, all-MiniLM-L6-v2, no API key (§5)
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI TestClient transport
    "sentence-transformers>=3.0",  # eval recall@3 + rag integration tests need the real model
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert freely and skip some annotation strictness.
"tests/**" = []

[tool.mypy]
python_version = "3.12"  # numpy (via sentence-transformers) ships 3.12-syntax stubs
strict = true
files = ["src", "tests", "eval.py"]
mypy_path = "src:tests"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

# sentence-transformers and pyyaml ship no type information mypy can use here.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "yaml"]
ignore_missing_imports = true

# chromadb ships strict inline types whose over-narrow arg types (ndarray-only
# embeddings, invariant metadata mappings) fight plain-Python inputs; treat its
# boundary as untyped rather than casting at every call site.
[[tool.mypy.overrides]]
module = ["chromadb.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
markers = [
    "network: needs network + model download (real NIST catalog / embeddings); run as a separate CI job",
]
