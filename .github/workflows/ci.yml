name: CI

on:
  push:
  pull_request:

jobs:
  # Gate: fast, deterministic, no network. This is what must stay green.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest (fast gate, no network)
        run: pytest -m "not network"

  # Integration: real NIST fetch + embeddings. Separate job so a NIST outage or a
  # slow model download does not red the gate above.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (network)
        run: pytest -m network
