name: keep-alive

# Pings the deployed Space's /healthz every 12 hours. Two jobs in one:
#   1. keeps the free-tier Hugging Face Space warm (it sleeps when idle), and
#   2. acts as a freshness monitor — the workflow FAILS if the request errors or
#      if kev_staleness_warning is true (KEV feed >7 days stale on the Space).
# Check the workflow logs, not just the page, if something looks stale later.
#
# Setup: set the repo variable SPACE_HEALTH_URL to the Space health endpoint, e.g.
#   gh variable set SPACE_HEALTH_URL --body "https://<owner>-<space>.hf.space/healthz"
# (or Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Space health URL
        run: |
          URL="${{ vars.SPACE_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Repo variable SPACE_HEALTH_URL is not set. Set it to https://<owner>-<space>.hf.space/healthz"
            exit 1
          fi
          echo "HEALTH_URL=$URL" >> "$GITHUB_ENV"

      - name: Ping /healthz and check KEV freshness
        run: |
          echo "GET $HEALTH_URL"
          # A cold free-tier Space can take ~30-60s to wake; retry before giving up.
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 90 "$HEALTH_URL"); then
              echo "response: $body"
              stale=$(printf '%s' "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('kev_staleness_warning'))")
              if [ "$stale" = "True" ]; then
                echo "::error::kev_staleness_warning is true — the served KEV feed is >7 days stale on the Space."
                exit 1
              fi
              echo "Space is healthy and KEV is fresh (kev_staleness_warning=$stale)."
              exit 0
            fi
            echo "attempt $attempt failed; waiting 20s before retry..."
            sleep 20
          done
          echo "::error::/healthz did not respond successfully after 5 attempts."
          exit 1
